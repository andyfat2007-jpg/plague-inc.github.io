<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAGUE.INC // ОИДЛ</title>

<meta name="theme-color" content="#0b0f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLAGUE.INC">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ph:#3dff74;
    --ph-dim:rgba(61,255,116,.55);
    --ph-faint:rgba(61,255,116,.25);
    --ph-glow:rgba(46,255,106,.55);
    --mk1:#c98bff; --mk2:#8a44e8; --mk3:#3c1a66; --mk-glow:rgba(170,100,255,.6);
    --adm:#ff5b5b; --adm-glow:rgba(255,80,80,.55);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overflow-x:hidden; }
  body{
    min-height:100vh;
    display:grid; place-items:center;
    background:radial-gradient(1200px 800px at 50% 40%, #0c0f0c, #050605 75%);
    font-family:'JetBrains Mono','Courier New',monospace;
    padding:20px 10px;
    touch-action:manipulation;
  }
  body.kbd-open{ padding-bottom:262px; }

  #vaultShade{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:1200;
    opacity:0;
    transition:opacity 1.6s ease;
    background:radial-gradient(120% 120% at 50% 40%,
      rgba(0,6,1,.45), rgba(0,0,0,.78) 80%);
  }
  body.lights-off #vaultShade{ opacity:1; }

  .terminal{
    position:relative;
    z-index:0;
    width:min(1200px,97vw);
    display:grid;
    grid-template-columns:1fr 234px;
    gap:20px;
    padding:26px;
    border-radius:18px;
    border:1px solid #000;
    background:linear-gradient(180deg,#262a26,#171a17 60%,#101310);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.05),
      inset 0 -3px 8px rgba(0,0,0,.6),
      0 30px 80px rgba(0,0,0,.85);
    user-select:none;
  }
  .terminal::before{
    content:''; position:absolute; inset:0; border-radius:18px;
    pointer-events:none; z-index:0;
    background:
      radial-gradient(44px 32px at 0% 0%, rgba(190,196,182,.17), transparent 70%),
      radial-gradient(38px 28px at 100% 0%, rgba(190,196,182,.14), transparent 70%),
      radial-gradient(48px 34px at 0% 100%, rgba(190,196,182,.16), transparent 70%),
      radial-gradient(42px 30px at 100% 100%, rgba(190,196,182,.13), transparent 70%),
      linear-gradient(115deg, transparent 46%, rgba(220,226,214,.14) 46% 48%, transparent 48.6%) 8% 12% / 90px 70px no-repeat,
      linear-gradient(65deg, transparent 44%, rgba(220,226,214,.12) 44% 45.6%, transparent 46.2%) 45% 26% / 120px 90px no-repeat,
      linear-gradient(100deg, transparent 47%, rgba(220,226,214,.13) 47% 48.4%, transparent 49%) 76% 10% / 100px 80px no-repeat,
      linear-gradient(58deg, transparent 45%, rgba(220,226,214,.10) 45% 46.4%, transparent 47%) 22% 70% / 110px 90px no-repeat,
      linear-gradient(122deg, transparent 46.5%, rgba(220,226,214,.12) 46.5% 47.8%, transparent 48.4%) 82% 66% / 100px 90px no-repeat,
      linear-gradient(80deg, transparent 44%, rgba(220,226,214,.10) 44% 45.2%, transparent 45.8%) 55% 88% / 120px 80px no-repeat,
      radial-gradient(5px 4px at 4% 9%, rgba(200,206,192,.5), transparent 70%),
      radial-gradient(4px 3px at 5.5% 6%, rgba(200,206,192,.4), transparent 70%),
      radial-gradient(6px 4px at 95.5% 8%, rgba(200,206,192,.45), transparent 70%),
      radial-gradient(4px 3px at 94% 12%, rgba(200,206,192,.35), transparent 70%),
      radial-gradient(5px 4px at 3.5% 93%, rgba(200,206,192,.4), transparent 70%),
      radial-gradient(6px 4px at 96% 91%, rgba(200,206,192,.4), transparent 70%);
  }
  .terminal::after{
    content:''; position:absolute; inset:0; border-radius:18px;
    pointer-events:none; z-index:0;
    background:
      radial-gradient(90px 70px at 4% 3%, rgba(122,66,28,.36), transparent 70%),
      radial-gradient(70px 60px at 97% 6%, rgba(96,52,22,.32), transparent 72%),
      radial-gradient(110px 84px at 3% 97%, rgba(110,60,26,.30), transparent 70%),
      radial-gradient(84px 70px at 98% 95%, rgba(88,48,20,.33), transparent 72%),
      radial-gradient(24px 16px at 14% 2%, rgba(122,66,28,.22), transparent 70%),
      radial-gradient(20px 14px at 88% 3%, rgba(104,56,24,.2), transparent 70%),
      radial-gradient(22px 16px at 2% 82%, rgba(114,62,26,.2), transparent 70%),
      radial-gradient(26px 18px at 97% 78%, rgba(96,52,22,.22), transparent 70%);
  }

  .crt-assembly{ position:relative; z-index:1; }
  .control-panel{ position:relative; z-index:1; }

  .crt-bezel{
    position:relative;
    background:linear-gradient(180deg,#0d0f0d,#050605);
    border-radius:22px;
    padding:22px;
    box-shadow:inset 0 0 0 1px #000, inset 0 4px 14px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.04);
  }
  .crt-bezel::after{
    content:''; position:absolute; inset:0; border-radius:22px;
    pointer-events:none; z-index:8;
    background:
      radial-gradient(60% 24% at 70% 5%, rgba(210,220,205,.07), transparent 70%),
      radial-gradient(52% 20% at 20% 92%, rgba(200,210,195,.06), transparent 70%),
      radial-gradient(30% 14% at 82% 96%, rgba(190,200,185,.05), transparent 70%),
      radial-gradient(24% 10% at 42% 2%, rgba(205,215,200,.05), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.02), transparent 30%);
  }
  .screen{
    position:relative;
    aspect-ratio:4/3;
    border-radius:4.5% / 6%;
    overflow:hidden;
    background:#020402;
    box-shadow:inset 0 0 60px rgba(0,20,5,.9), inset 0 0 8px #000;
  }
  .screen.on{
    box-shadow:inset 0 0 60px rgba(0,30,8,.85), inset 0 0 8px #000, 0 0 46px rgba(61,255,116,.10);
  }
  .screen::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(60% 35% at 30% 12%, rgba(255,255,255,.06), transparent 60%);
    pointer-events:none;
    z-index:5;
  }
  .glass-crack{
    position:absolute; top:3%; right:2.5%;
    width:120px; height:90px;
    background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20120%2090'%3E%3Cg%20stroke='%23dfe8e2'%20fill='none'%20stroke-linecap='round'%3E%3Cpath%20d='M96%2010%20L72%2028%20L54%2033%20L34%2050'%20stroke-width='1.4'%20stroke-opacity='.55'/%3E%3Cpath%20d='M96%2010%20L103%2032%20L97%2050'%20stroke-width='1.2'%20stroke-opacity='.5'/%3E%3Cpath%20d='M97%2050%20L85%2064%20L81%2078'%20stroke-width='1.1'%20stroke-opacity='.45'/%3E%3Cpath%20d='M72%2028%20L66%2046%20L55%2057'%20stroke-width='1'%20stroke-opacity='.45'/%3E%3Cpath%20d='M54%2033%20L46%2025%20L30%2023'%20stroke-width='.9'%20stroke-opacity='.4'/%3E%3Cpath%20d='M55%2057%20L42%2063%20L26%2061'%20stroke-width='.9'%20stroke-opacity='.4'/%3E%3Cpath%20d='M96%2010%20L85%206%20L72%209'%20stroke-width='.8'%20stroke-opacity='.38'/%3E%3Cpath%20d='M103%2032%20L114%2040'%20stroke-width='.8'%20stroke-opacity='.38'/%3E%3Cpath%20d='M81%2078%20L75%2087'%20stroke-width='.7'%20stroke-opacity='.34'/%3E%3C/g%3E%3Cellipse%20cx='96'%20cy='10'%20rx='7'%20ry='5'%20fill='none'%20stroke='%23dfe8e2'%20stroke-opacity='.35'%20stroke-width='.8'/%3E%3C/svg%3E") center / 100% 100% no-repeat;
    pointer-events:none;
    z-index:6;
    opacity:.85;
  }

  .screen-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:4% 5%;
    overflow:hidden;
    color:var(--ph);
    text-shadow:0 0 5px var(--ph-glow), 0 0 18px rgba(46,255,106,.25);
    font-size:clamp(11px,1.6vw,18px);
    line-height:1.5;
    transform-origin:center;
  }
  .screen-inner.crt-on{ animation:crtOn 1.2s ease-out forwards; }
  .screen-inner.crt-off{ animation:crtOff .65s ease-in forwards; }
  @keyframes crtOn{
    0%   { transform:scale(1,.004); filter:brightness(5); }
    35%  { transform:scale(1,.006); filter:brightness(6); }
    60%  { transform:scale(1,.05);  filter:brightness(4); }
    100% { transform:scale(1,1);    filter:brightness(1); }
  }
  @keyframes crtOff{
    0%   { transform:scale(1,1);    filter:brightness(1); }
    45%  { transform:scale(1,.012); filter:brightness(4); }
    75%  { transform:scale(1,.004); filter:brightness(6); }
    100% { transform:scale(1,.001); filter:brightness(0); opacity:0; }
  }

  .ln{ white-space:pre-wrap; }
  .ln.dim{ color:var(--ph-dim); }
  .ln.bright{ color:#d9ffe4; text-shadow:0 0 6px var(--ph-glow), 0 0 20px rgba(46,255,106,.4); }
  .ln.pink{ color:#ff9de2; text-shadow:0 0 5px rgba(255,110,210,.65), 0 0 16px rgba(255,110,210,.3); }
  .ln.red{ color:#ff7a7a; text-shadow:0 0 5px var(--adm-glow), 0 0 16px rgba(255,80,80,.3); }
  .ln.big{
    font-size:1.32em;
    line-height:1.6;
    letter-spacing:.04em;
    color:#c9ffd9;
    text-shadow:0 0 6px var(--ph-glow), 0 0 22px rgba(46,255,106,.35);
  }
  .brand{
    color:var(--mk1);
    text-shadow:0 0 5px var(--mk-glow), 0 0 16px rgba(140,70,255,.35);
  }
  .cursor{ animation:blink 1.06s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .scanlines{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    transform:translateZ(0);
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,.28) 0px, rgba(0,0,0,.28) 1px,
      transparent 1px, transparent 3px);
  }
  .flicker{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    transform:translateZ(0);
    background:rgba(61,255,116,.05);
    animation:flicker 3.7s infinite steps(1);
  }
  @keyframes flicker{
    0%,100%{opacity:.25} 7%{opacity:.45} 9%{opacity:.15} 11%{opacity:.4}
    43%{opacity:.25} 47%{opacity:.5} 49%{opacity:.25} 74%{opacity:.38} 76%{opacity:.2}
  }
  .vignette{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    transform:translateZ(0);
    background:radial-gradient(120% 100% at 50% 50%,
      transparent 55%, rgba(0,0,0,.45) 88%, rgba(0,0,0,.75) 100%);
  }
  .flash{
    position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 50%,
      rgba(234,255,239,.95), rgba(120,255,160,.35) 45%, transparent 70%);
  }
  .flash.flash-anim{ animation:flashAnim .3s ease-out forwards; }
  @keyframes flashAnim{ 0%{opacity:0} 18%{opacity:.95} 100%{opacity:0} }

  .status-bar{
    position:absolute; left:0; right:0; top:0;
    display:flex; justify-content:space-between; gap:10px;
    font-size:.8em; color:var(--ph-dim);
    text-shadow:0 0 4px var(--ph-glow);
    letter-spacing:.08em;
    background:linear-gradient(180deg, rgba(61,255,116,.10), rgba(2,4,2,.88) 75%);
    border-bottom:3px double var(--ph-faint);
    box-shadow:0 2px 14px rgba(0,0,0,.5);
    padding:5px 4%;
    pointer-events:none;
    z-index:5;
  }
  .admin-tag{ color:var(--adm); text-shadow:0 0 5px var(--adm-glow); }
  .maker-tag{ color:var(--mk1); text-shadow:0 0 5px var(--mk-glow); }

  .skip-hint{
    position:absolute; right:3%; bottom:12%; z-index:5;
    font-size:.72em; color:var(--ph-dim); opacity:.4;
    pointer-events:none;
  }

  .hidden{ display:none !important; }

  .crt-label{
    margin-top:12px; text-align:center;
    font-size:11px; letter-spacing:.3em; color:#77817a;
  }
  .crt-label span{ color:#4d574f; }

  .control-panel{
    display:flex; flex-direction:column; align-items:center;
    gap:20px; padding:26px 10px;
    background:linear-gradient(180deg,#1b1e1b,#121512);
    border-radius:14px; border:1px solid #000;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    perspective:700px;
  }
  .plate{
    font-size:11px; letter-spacing:.22em; color:#8a938a;
    border:1px solid #3a3f3a; padding:6px 10px; border-radius:4px;
    background:#0c0e0c; text-align:center;
    position:relative;
    overflow:hidden;
  }
  .plate::before{
    content:'';
    position:absolute; inset:-4px;
    background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='34'%20viewBox='0%200%20140%2034'%3E%3Cpath%20d='M8%2027%20L34%2020%20L60%2021%20L88%2011%20L112%2012%20L132%205'%20stroke='rgba(255,255,255,0.22)'%20stroke-width='1.6'%20fill='none'%20stroke-linecap='round'/%3E%3Cpath%20d='M9%2028%20L35%2021%20L61%2022%20L89%2012%20L113%2013%20L133%206'%20stroke='rgba(0,0,0,0.55)'%20stroke-width='0.9'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E") center / 100% 100% no-repeat;
    pointer-events:none;
    z-index:0;
  }
  .plate-text{ position:relative; z-index:1; }

  .lamps{ display:flex; gap:13px; align-items:flex-start; }
  .lamp{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .lamp-socket{
    position:relative; width:16px; height:16px; border-radius:50%;
    background:#0b0d0b;
    box-shadow:
      inset 0 2px 4px #000,
      0 0 0 2px #1f231f,
      0 0 0 3px rgba(255,255,255,.04),
      0 1px 3px rgba(0,0,0,.7);
  }
  .lamp-core{
    position:absolute; inset:3px; border-radius:50%;
    background:var(--lc);
    opacity:.14; filter:saturate(.6);
    transition:opacity .15s, box-shadow .15s;
  }
  .lamp.on .lamp-core{ opacity:1; filter:none; box-shadow:0 0 9px var(--lc), 0 0 3px var(--lc); }
  .lamp.busy .lamp-core{ opacity:1; filter:none; animation:lampBlink .4s steps(2,end) infinite; }
  @keyframes lampBlink{
    0%,49%{ opacity:1; box-shadow:0 0 9px var(--lc); }
    50%,100%{ opacity:.14; box-shadow:none; }
  }
  .lamp-label{ font-size:7.5px; letter-spacing:.08em; color:#6f7a70; }
  .lamp.green{ --lc:#3dff74; }
  .lamp.amber{ --lc:#ffb84d; }
  .lamp.blue{ --lc:#5fc9ff; }

  .cam{
    position:relative;
    width:40px; height:40px;
    border:none; padding:0; background:transparent;
    cursor:pointer;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.65));
  }
  body.touch .cam{ width:48px; height:48px; }
  .cam:active{ transform:scale(.92); }
  .cam:focus{ outline:none; }
  .cam:focus-visible{ outline:1px solid rgba(61,255,116,.5); outline-offset:3px; border-radius:50%; }
  .cam span{ position:absolute; border-radius:50%; pointer-events:none; }
  .cam-ring{
    inset:0;
    background:repeating-conic-gradient(#78827a 0deg 5deg, #232723 5deg 10deg);
    box-shadow:
      inset 0 0 0 1px #000,
      inset 0 2px 3px rgba(255,255,255,.28),
      inset 0 -3px 5px rgba(0,0,0,.75);
  }
  .cam-barrel{
    inset:5px;
    background:radial-gradient(circle at 34% 30%, #39413c, #151815 58%, #060806);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.14),
      inset 0 -2px 5px #000,
      0 0 0 1px #000;
  }
  .cam-glass{
    inset:10px;
    background:
      radial-gradient(circle at 30% 26%, rgba(255,255,255,.9) 0 7%, rgba(255,255,255,.18) 12%, transparent 24%),
      radial-gradient(circle at 70% 74%, rgba(150,200,255,.28) 0 9%, transparent 20%),
      radial-gradient(circle at 50% 50%, #1b2c49 0 26%, #0c1524 52%, #04070d 100%);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.95),
      inset 0 0 8px rgba(0,0,0,.9),
      inset 0 2px 5px rgba(130,180,255,.22);
  }
  .cam-glass::before{
    content:''; position:absolute; left:18%; top:14%;
    width:14%; height:14%; border-radius:50%;
    background:rgba(255,255,255,.75);
    filter:blur(.3px);
  }
  .cam-glass::after{
    content:''; position:absolute; inset:24%;
    border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #2a4166 0 38%, #0a1322 72%, #050a12 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.07),
      inset 0 0 4px #000;
  }
  .cam-sweep{ inset:10px; overflow:hidden; }
  .cam-sweep::before{
    content:''; position:absolute; top:-30%; left:-45%;
    width:34%; height:160%;
    background:linear-gradient(100deg, transparent, rgba(190,220,255,.16) 45%, rgba(255,255,255,.10) 55%, transparent);
    transform:skewX(-12deg);
    animation:camSweep 5.2s linear infinite;
  }
  @keyframes camSweep{
    0%   { left:-45%; }
    62%  { left:120%; }
    100% { left:120%; }
  }
  .cam-led{
    top:-3px; right:-3px;
    width:9px; height:9px;
    background:#ff5252;
    border:1px solid #5e0f0f;
    box-shadow:0 0 7px rgba(255,70,70,.9), inset 0 1px 1px rgba(255,255,255,.5);
    animation:camRec 1.7s steps(2,end) infinite;
    z-index:3;
  }
  @keyframes camRec{
    0%,55%  { opacity:1; }
    56%,100%{ opacity:.22; box-shadow:none; }
  }

  .lever-block{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    perspective:600px;
  }
  .lever-recess{
    position:relative;
    border-radius:14px;
    padding:10px;
    background:linear-gradient(180deg,#040604,#0b0d0a 55%,#020302);
    box-shadow:
      inset 0 4px 9px rgba(0,0,0,.95),
      inset 0 -1px 2px rgba(255,255,255,.04),
      inset 0 0 0 1px #000;
  }
  .lever-plate{
    position:relative;
    width:112px;
    padding:16px 12px 14px;
    border-radius:10px;
    border:1px solid #000;
    background:linear-gradient(180deg,#424a43,#2a2f28 55%,#191c17);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 -3px 6px rgba(0,0,0,.5),
      0 2px 6px rgba(0,0,0,.55);
    display:flex; flex-direction:column; align-items:center;
  }
  .lv-screw{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6a736c, #14170f 70%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 1px 1px #000;
  }
  .lv-screw::after{
    content:''; position:absolute; left:1px; right:1px; top:3px; height:1px;
    background:rgba(0,0,0,.75);
  }
  .lv-screw.tl{ top:5px; left:5px; }
  .lv-screw.tr{ top:5px; right:5px; }
  .lv-screw.bl{ bottom:5px; left:5px; }
  .lv-screw.br{ bottom:5px; right:5px; }

  .lever-label{ font-size:10px; letter-spacing:.15em; }
  .lever-label.on{ color:var(--ph); text-shadow:0 0 5px var(--ph-glow); margin-bottom:12px; }
  .lever-label.off{ color:#6a746c; margin-top:12px; }

  .lever-slot{
    position:relative; width:26px; height:150px;
    background:linear-gradient(90deg,#050605,#0e100e,#050605);
    border-radius:13px;
    box-shadow:inset 0 0 8px #000, 0 1px 0 rgba(255,255,255,.04);
    touch-action:none;
  }
  .lever-slot::before,
  .lever-slot::after{
    content:''; position:absolute; top:8px; bottom:8px; width:2px;
    background:rgba(255,255,255,.05);
    box-shadow:0 0 2px rgba(0,0,0,.8);
  }
  .lever-slot::before{ left:5px; }
  .lever-slot::after{ right:5px; }
  .tick{
    position:absolute; right:-13px;
    width:7px; height:2px;
    background:#9aa39a; opacity:.55;
  }
  .tick.t{ top:0; }
  .tick.b{ bottom:0; }

  .lever-knob{
    position:absolute; left:50%; top:110px;
    width:54px; height:38px;
    transform:translateX(-50%);
    background:transparent;
    cursor:grab;
    touch-action:none;
    will-change:transform;
  }

function fbEmail(name){
  const lower=name.toLowerCase();
  let bytes;
  if(window.TextEncoder){ bytes=new TextEncoder().encode(lower); }
  else{
    const arr=[]; for(const ch of lower){ const c=ch.charCodeAt(0); arr.push(c&0xff,(c>>8)&0xff); }
    bytes=new Uint8Array(arr);
  }
  let hex='';
  for(let i=0;i<bytes.length;i++) hex+=('0'+bytes[i].toString(16)).slice(-2);
  return 'op'+hex+'@plagueinc.site';
}
function fbPass(name,pass){
  return 'OIDL'+oidlHash(name.toLowerCase()+'|'+pass);
}
function oidlHash(s){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2+c+i)>>>0; h2=Math.imul(h2,0x85ebca6b)>>>0;
    h2=(h2^(h2>>>13))>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}

let audioCtx=null, noiseBuffer=null, hum=null;
function makeNoiseBuffer(ctx){
  const len=ctx.sampleRate*2;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    audioCtx=new AC();
    noiseBuffer=makeNoiseBuffer(audioCtx);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function canPlayNow(){ return audioCtx&&audioCtx.state==='running'; }
function startHum(){
  ensureAudio();
  if(!audioCtx||!canPlayNow()||hum) return;
  const master=audioCtx.createGain();
  master.gain.value=0.0001;
  master.connect(audioCtx.destination);
  const o50=audioCtx.createOscillator(); o50.type='sine'; o50.frequency.value=50;
  const g50=audioCtx.createGain(); g50.gain.value=0.028; o50.connect(g50); g50.connect(master);
  const o100=audioCtx.createOscillator(); o100.type='triangle'; o100.frequency.value=100;
  const g100=audioCtx.createGain(); g100.gain.value=0.010; o100.connect(g100); g100.connect(master);
  const n1=audioCtx.createBufferSource(); n1.buffer=noiseBuffer; n1.loop=true;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=7000; bp.Q.value=0.6;
  const gn1=audioCtx.createGain(); gn1.gain.value=0.006;
  n1.connect(bp); bp.connect(gn1); gn1.connect(master);
  const n2=audioCtx.createBufferSource(); n2.buffer=noiseBuffer; n2.loop=true; n2.playbackRate.value=0.35;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
  const gn2=audioCtx.createGain(); gn2.gain.value=0.05;
  n2.connect(lp); lp.connect(gn2); gn2.connect(master);
  o50.start(); o100.start(); n1.start(); n2.start();
  master.gain.linearRampToValueAtTime(1,audioCtx.currentTime+1.4);
  hum={master,nodes:[o50,o100,n1,n2]};
}
function stopHum(fade){
  fade=fade||0.6;
  if(!audioCtx||!hum){ hum=null; return; }
  const m=hum.master, nodes=hum.nodes; hum=null;
  const t=audioCtx.currentTime;
  m.gain.cancelScheduledValues(t);
  m.gain.setValueAtTime(m.gain.value,t);
  m.gain.linearRampToValueAtTime(0.0001,t+fade);
  setTimeout(()=>{ nodes.forEach(n=>{try{n.stop();}catch(e){}}); try{m.disconnect();}catch(e){} },fade*1000+120);
}
function blip(o){
  o=o||{};
  const freq=o.freq||800, dur=o.dur||0.05, type=o.type||'square', vol=(o.vol!==undefined?o.vol:0.06), slide=o.slide||0;
  ensureAudio(); if(!canPlayNow()) return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(); osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.02);
}
function noiseBurst(o){
  o=o||{};
  const dur=o.dur||0.06, vol=(o.vol!==undefined?o.vol:0.08), freq=o.freq||1800, type=o.type||'lowpass';
  ensureAudio(); if(!canPlayNow()) return;
  const t=audioCtx.currentTime;
  const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer;
  const f=audioCtx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t+dur+0.02);
}
let gearNoise=null;
function startGearNoise(){
  ensureAudio(); if(!canPlayNow()) return;
  stopGearNoise();
  const src=audioCtx.createBufferSource(); src.buffer=noiseBuffer; src.loop=true;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=150;
  const g=audioCtx.createGain(); g.gain.value=0.055;
  const lfo=audioCtx.createOscillator(); lfo.frequency.value=0.7;
  const lg=audioCtx.createGain(); lg.gain.value=0.025;
  lfo.connect(lg); lg.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
  src.start(); lfo.start();
  gearNoise={stop(){
    try{ src.stop(); lfo.stop(); }catch(e){}
    try{ g.disconnect(); }catch(e){}
  }};
}
function stopGearNoise(){
  if(gearNoise){ gearNoise.stop(); gearNoise=null; }
}

function brandify(el){
  const t=el.textContent;
  if(!t||t.indexOf('PLAGUE.INC')===-1) return el;
  el.textContent='';
  const parts=t.split('PLAGUE.INC');
  parts.forEach((p,i)=>{
    if(i){ const s=document.createElement('span'); s.className='brand'; s.textContent='PLAGUE.INC'; el.appendChild(s); }
    if(p) el.appendChild(document.createTextNode(p));
  });
  return el;
}
function addLine(text,cls){
  const div=document.createElement('div');
  div.className='ln'+(cls?' '+cls:'');
  div.textContent=text;
  brandify(div);
  screenContent.appendChild(div);
  return div;
}
function sleep(ms){ return new Promise(res=>setTimeout(res,skipBoot?0:ms)); }
async function typeLine(text,speed){
  const div=addLine('');
  for(const ch of text){
    if(skipBoot){ div.textContent=text; brandify(div); return; }
    div.textContent+=ch; brandify(div);
    await sleep(speed);
  }
}

const FW=42, INNER=40;
function centerText(s,w){ if(s.length>=w) return s; const l=Math.floor((w-s.length)/2); return ' '.repeat(l)+s+' '.repeat(w-s.length-l); }
function dTop(){ return '╔'+'═'.repeat(INNER)+'╗'; }
function dRow(s){ return '║'+centerText(s,INNER)+'║'; }
function dBot(){ return '╚'+'═'.repeat(INNER)+'╝'; }
function sTop(t){ const h='─ '+t+' '; return '┌'+h+'─'.repeat(Math.max(0,INNER-h.length))+'┐'; }
function sRow(s){ return ('│'+s).padEnd(FW,' ')+'│'; }
function sBot(){ return '└'+'─'.repeat(INNER)+'┘'; }
function sep(t){ const l='═══[ '+t+' ]'; return l+'═'.repeat(Math.max(0,FW-l.length)); }
function statLine(prefix,name,status){
  const left=prefix+name;
  let dots=INNER-left.length-status.length-2; if(dots<1) dots=1;
  return ('│'+left+' '+'·'.repeat(dots)+' '+status).padEnd(FW,' ');
}
function sysLine(name,status){
  const tail=' [ '+status+' ]';
  let dots=39-name.length-tail.length; if(dots<1) dots=1;
  return ' '+name+' '+'·'.repeat(dots)+tail;
}

async function memoryCheck(){
  addLine(sTop('ПРОВЕРКА ОЗУ'));
  const div=addLine('');
  const barW=17,dur=4200,start=performance.now();
  await new Promise(res=>{
    function frame(now){
      let p=Math.min(1,(now-start)/dur); if(skipBoot)p=1;
      const f=Math.round(p*barW);
      div.textContent=sRow(' ▕'+'█'.repeat(f)+'░'.repeat(barW-f)+'▏ '+String(Math.floor(p*100)).padStart(3,'0')+'%');
      if(p>=1){res();return;} requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  div.textContent=sRow(' ▕'+'█'.repeat(barW)+'▏ 65536 БАЙТ · ОК');
  addLine(sBot());
}

function xpRank(xp){
  if(xp>=XP_THRESHOLDS[4]) return 5;
  if(xp>=XP_THRESHOLDS[3]) return 4;
  if(xp>=XP_THRESHOLDS[2]) return 3;
  if(xp>=XP_THRESHOLDS[1]) return 2;
  return 1;
}
let adminMode=false;
let mkGranted=false;
let mkVia=null;
function effRank(){
  if(mkGranted) return 7;
  if(adminMode) return 6;
  if(myDoc){
    ensureOpFields(myDoc);
    if(myDoc.manualRank) return myDoc.manualRank;
    return xpRank(myDoc.xp);
  }
  return 1;
}
function rankBadge(){
  const r=effRank();
  return '[ДОПУСК '+r+' · '+RANK_NAMES[r]+']';
}
async function grantReward(delta,extraMedalCheck){
  const notes=[];
  if(!myUid||!myDoc) return notes;
  ensureOpFields(myDoc);
  const oldRank=xpRank(myDoc.xp);
  if(delta){
    myDoc.xp+=delta;
    sfx.xp();
    notes.push('+ '+delta+' XP');
  }
  const newRank=xpRank(myDoc.xp);
  const upd={xp:myDoc.xp, medals:myDoc.medals, stats:myDoc.stats};
  if(newRank>oldRank){
    notes.push('▲ ДОПУСК ПОВЫШЕН ▸ ['+newRank+'] '+RANK_NAMES[newRank]);
    sfx.rankup();
  }
  let got=[];
  if(typeof extraMedalCheck==='function') got=extraMedalCheck(myDoc);
  got=got.concat(checkAutoMedals(myDoc));
  got.forEach((id)=>{
    if(!myDoc.medals.some(m=>m.id===id)){
      myDoc.medals.push({id:id,date:nowStamp()});
      notes.push('◆ МЕДАЛЬ: '+MEDALS[id].name);
      sfx.medal();
    }
  });
  try{
    await fxWrap(fs.collection('ops').doc(myUid).update(upd));
  }catch(e){ notes.push('▲ ОШИБКА СОХРАНЕНИЯ ПРОФИЛЯ'); }
  return notes;
}
function checkAutoMedals(op){
  ensureOpFields(op);
  const s=op.stats;
  const got=[];
  function g(id){ got.push(id); }
  if(s.journal>=1) g('first_journal');
  if(s.journal>=5) g('chronicler');
  if(s.pub>=1) g('first_pub');
  if(s.sciTotal>=1) g('researcher');
  if(s.sciMutant>=3) g('mutantolog');
  if(s.sciAnomaly>=3) g('anomalist');
  if(s.sciFlora>=3) g('naturalist');
  if(s.med>=1) g('healer');
  if(s.stock>=10) g('quartermaster');
  return got;
}

function genKeyCode(){
  const ab='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function part(){ let s=''; for(let i=0;i<4;i++) s+=ab[Math.floor(Math.random()*ab.length)]; return s; }
  return 'MK-'+part()+'-'+part();
}
function keyLeft(k){
  if(k.status!=='active') return 'ОТОЗВАН';
  const now=Date.now();
  if(k.limitType==='days'){
    const left=Math.ceil((k.expiresAt-now)/86400000);
    if(left<=0) return 'ИСТЁК';
    return left+' ДН';
  }
  if(k.limitType==='uses'){
    if(k.usesLeft<=0) return 'ИСЧЕРПАН';
    return k.usesLeft+' ВХОДОВ';
  }
  return 'ВЕЧНЫЙ';
}
function keyUsable(k){
  if(!k||k.status!=='active') return false;
  if(k.limitType==='days'&&Date.now()>k.expiresAt) return false;
  if(k.limitType==='uses'&&k.usesLeft<=0) return false;
  return true;
}

let registryNames=[];
let registryErr=null;
async function refreshRegistry(){
  registryNames=[];
  registryErr=null;
  if(!dbOK()){ registryErr='▲ БАЗА НЕДОСТУПНА'; return; }
  try{
    const q=await fxWrap(fs.collection('ops').limit(20).get());
    const seen={};
    const arr=[];
    q.docs.forEach(d=>{
      const n=d.data().name;
      if(n&&!seen[n.toLowerCase()]){ seen[n.toLowerCase()]=1; arr.push(n); }
    });
    arr.sort(function(a,b){
      return a.toLowerCase()<b.toLowerCase()?-1:(a.toLowerCase()>b.toLowerCase()?1:0);
    });
    registryNames=arr.slice(0,SLOTS);
  }catch(e){
    dbDown();
    registryNames=[];
    registryErr=authErrText(e);
  }
}

/* ---------- СКАН СЕТЧАТКИ ---------- */
function startRetinaScan(){
  menuState='retina'; inputBuf=''; menuLines=[];
  menuPrint(dTop(),'bright');
  menuPrint(dRow('СКАНИРОВАНИЕ СЕТЧАТКИ'),'bright');
  menuPrint(dBot(),'bright');
  menuPrint('');
  menuPrint(' ОПЕРАТОР ▸ '+(selectedOp||curOperator()||'?'));
  menuPrint('');
  const eyeTop=menuLines.length;
  for(let i=0;i<9;i++) menuPrint('');
  const beamIdx=menuLines.length;
  menuPrint('');
  const matchIdx=menuLines.length;
  menuPrint('');
  const barIdx=menuLines.length;
  menuPrint('');
  menuPrint(' ENTER / ESC ▸ ПРОПУСТИТЬ СКАН','dim');
  retinaLines={eyeTop:eyeTop,beam:beamIdx,match:matchIdx,bar:barIdx};
  renderInput();
  sfx.beep();

  retinaStart=performance.now();
  retinaPct=-1;
  let sweepAt=0;
  function frame(now){
    if(menuState!=='retina') return;
    const p=Math.min(1,(now-retinaStart)/SCAN_MS);
    const pct=Math.floor(p*100);
    if(pct!==retinaPct){
      retinaPct=pct;
      const pulse=Math.floor(now/700)%2===0;
      const pupil=pulse?'◉':'◎';
      menuLines[retinaLines.eyeTop+0].t='           ▄▄▄▄▄▄▄▄▄▄▄▄';
      menuLines[retinaLines.eyeTop+1].t='         ▄███████████████▄';
      menuLines[retinaLines.eyeTop+2].t='        ███▒▒▒▒▒▒▒▒▒▒▒▒▒▒███';
      menuLines[retinaLines.eyeTop+3].t='       ███▒░░░░░░░░░░░░░▒███';
      menuLines[retinaLines.eyeTop+4].t='       ███▒░░░░ '+pupil+'  ░░░░▒███';
      menuLines[retinaLines.eyeTop+5].t='       ███▒░░░░░░░░░░░░░▒███';
      menuLines[retinaLines.eyeTop+6].t='        ███▒▒▒▒▒▒▒▒▒▒▒▒▒▒███';
      menuLines[retinaLines.eyeTop+7].t='         ▀███████████████▀';
      menuLines[retinaLines.eyeTop+8].t='           ▀▀▀▀▀▀▀▀▀▀▀▀';
      const bx=Math.round((Math.sin(now/900)*0.5+0.5)*10);
      let beam=' ЛУЧ ▸ ';
      for(let i=0;i<11;i++) beam+=(i===bx)?'▼':'·';
      menuLines[retinaLines.beam].t=beam;
      const noisy=Math.max(0,pct-3+Math.random()*6);
      menuLines[retinaLines.match].t=' СОВПАДЕНИЕ ▸ '+noisy.toFixed(1)+'%';
      const barW=30, f=Math.round(p*barW);
      menuLines[retinaLines.bar].t=' ▕'+'█'.repeat(f)+'░'.repeat(barW-f)+'▏ '+String(pct).padStart(3,'0')+'%';
      renderInput();
      if(now-sweepAt>2800){ sweepAt=now; sfx.scanSweep(); }
      if(pct%10===0&&pct>0) sfx.tick();
    }
    if(p>=1){ finishRetinaScan(false); return; }
    retinaRAF=requestAnimationFrame(frame);
  }
  retinaRAF=requestAnimationFrame(frame);
}
function cancelRetinaScan(){
  if(retinaRAF){ cancelAnimationFrame(retinaRAF); retinaRAF=null; }
}
function finishRetinaScan(skipped){
  cancelRetinaScan();
  const name=selectedOp||curOperator()||'ОПЕРАТОР';
  const notes=[];
  if(myDoc){
    ensureOpFields(myDoc);
    const t=todayKey();
    if(myDoc.stats.lastDay!==t){
      const y=new Date(); y.setDate(y.getDate()-1);
      const yk=String(y.getDate()).padStart(2,'0')+'.'+String(y.getMonth()+1).padStart(2,'0')+'.'+LORE_YEAR;
      myDoc.stats.streak=(myDoc.stats.lastDay===yk)?(myDoc.stats.streak+1):1;
      myDoc.stats.lastDay=t;
      myDoc.stats.logins++;
      grantReward(XP.LOGIN,null).then(function(rn){
        rn.forEach(n=>notes.push(n));
        audit('ВХОД ▸ '+name);
        showMainMenuAfterLogin(notes);
      });
      notes.unshift(' СЕРИЯ ВХОДОВ ▸ '+myDoc.stats.streak+' ДН');
      return;
    }
    audit('ВХОД ▸ '+name);
  }
  showMainMenuAfterLogin(notes);
}
function showMainMenuAfterLogin(notes){
  menuState='granting'; inputBuf=''; menuLines=[];
  const name=selectedOp||curOperator()||'ОПЕРАТОР';
  menuPrint(dTop(),'bright');
  menuPrint(dRow('СЕТЧАТКА ОПОЗНАНА'),'bright');
  menuPrint(dRow('ОПЕРАТОР ▸ '+name),'bright');
  menuPrint(dBot(),'bright');
  notes.forEach(n=>menuPrint(n,'dim'));
  sfx.grant();
  renderInput();
  setTimeout(function(){ showMainMenu(notes); },1700);
}

      barDiv.t=' ▕'+'█'.repeat(f)+'░'.repeat(barW-f)+'▏ '+String(pct).padStart(3,'0')+'%';

      menuState='mk_pass';
      inputBuf='';
      renderInput();
      sfx.beep();
      return;
    }
    mkInitRAF=requestAnimationFrame(frame);
  }
  mkInitRAF=requestAnimationFrame(frame);

function showJournal(noteLines){
  menuState='j_menu'; inputBuf=''; resetScratch(); menuLines=[];
  menuPrint(dTop(),'bright');
  menuPrint(dRow('ЗАПИСИ УЧАСТНИКОВ'),'bright');

  menuPrint(dBot(),'bright');
  menuPrint('');
  menuPrint(' ЗАПРОС ЗАПИСЕЙ...','dim');
  renderInput();

  let mine=[], others=[];
  const p1=fxWrap(fs.collection('journal').where('authorUid','==',myUid).get())
    .then(q=>{ q.docs.forEach(d=>mine.push(Object.assign({id:d.id},d.data()))); })
    .catch(()=>{ dbDown(); });
  const p2=fxWrap(fs.collection('journal').where('public','==',true).get())
    .then(q=>{ q.docs.forEach(d=>{
      const e=Object.assign({id:d.id},d.data());
      if(e.authorUid!==myUid) others.push(e);
    }); })
    .catch(()=>{});
  Promise.all([p1,p2]).then(function(){
    menuLines=[];
    menuPrint(dTop(),'bright');
    menuPrint(dRow('ЗАПИСИ УЧАСТНИКОВ'),'bright');
    menuPrint(dRow('ЛИЧНЫЙ ДНЕВНИК'),'bright');
    menuPrint(dBot(),'bright');
    menuPrint('');
    if(!mine.length) menuPrint(' У ВАС НЕТ ЗАПИСЕЙ','dim');
    else{
      menuPrint('──[ МОИ ЗАПИСИ ]──');
      mine.forEach((e,i)=>menuPrint('  ['+(i+1)+'] ▸ '+e.title+(e.public?' ◈ПУБ':'')));
    }
    if(others.length){
      menuPrint('');
      menuPrint('──[ ПУБЛИЧНЫЕ ДРУГИХ ]──');
      others.forEach((e,i)=>menuPrint('  ['+(mine.length+i+1)+'] ▸ '+e.title+' — '+e.author));
    }
    menuPrint('');
    menuPrint('  [Н] ▸ НОВАЯ ЗАПИСЬ');
    menuPrint('  [0] ▸ НАЗАД');
    menuPrint('');
    printNotes(noteLines);
    menuPrint(' НОМЕР — ОТКРЫТЬ · [Н] — СОЗДАТЬ','dim');
    jMine=mine; jOthers=others;
    renderInput();
    sfx.beep();
  });
}

let jStock=[];
function stockApply(name,qty,mode){
  const lower=name.toLowerCase();
  const rec=jStock.find(s=>s.id===lower);
  let note;
  const doFinish=function(){
    if(mode==='add') note=' ИТОГ ▸ ПРИНЯТО '+name+' +'+qty+' ШТ';
    else note=' ИТОГ ▸ ВЫДАНО '+name+' -'+qty+' ШТ';
    audit('СКЛАД ▸ '+(mode==='add'?'ПРИНЯТО ':'ВЫДАНО ')+name+' '+(mode==='add'?'+':'-')+qty);
    grantReward(XP.STOCK,function(op){ ensureOpFields(op); op.stats.stock++; return []; })
      .then(function(r2){ showStock([note].concat(r2)); });
  };
  if(mode==='add'){
    if(rec){
      fxWrap(fs.collection('stock').doc(lower).update({qty:rec.qty+qty}))
        .then(()=>doFinish())
        .catch(()=>showStock([' ▲ ОШИБКА ЗАПИСИ В БАЗУ']));
    } else {
      fxWrap(fs.collection('stock').doc(lower).set({name:name,qty:qty}))
        .then(()=>doFinish())
        .catch(()=>showStock([' ▲ ОШИБКА ЗАПИСИ В БАЗУ']));
    }
    return;
  }
  if(!isMaker()&&!rec){
    sfx.error();
    showStock([' ▲ ОТКАЗ ▸ «'+name+'» НЕТ НА СКЛАДЕ · ПРИМИТЕ ЧЕРЕЗ [П]']);
    return;
  }
  if(!isMaker()&&rec.qty<qty){
    sfx.error();
    showStock([' ▲ ОТКАЗ ▸ «'+rec.name+'» В НАЛИЧИИ ТОЛЬКО '+rec.qty+' ШТ']);
    return;
  }
  const left=rec?(rec.qty-qty):-qty;
  const p=rec
    ? fs.collection('stock').doc(lower).update({qty:left})
    : fs.collection('stock').doc(lower).set({name:name,qty:left});
  fxWrap(p).then(()=>doFinish()).catch(()=>showStock([' ▲ ОШИБКА ЗАПИСИ В БАЗУ']));
}

function startGearCycle(){
  gearTarget=(gearState==='closed')?'open':'closed';
  menuState='gear'; inputBuf=''; menuLines=[];
  const what=(gearTarget==='open')?'ОТКРЫТИЕ':'ЗАКРЫТИЕ';
  menuPrint(dTop(),'bright');
  menuPrint(dRow('ШЕСТЕРНЯ СТОЙЛА · '+what),'bright');
  menuPrint(dBot(),'bright');
  menuPrint('');
  menuPrint('      ⚙ ПРИВОД МЕХАНИЗМА ЗАПУЩЕН');
  const barIdx=menuLines.length;
  menuPrint('');
  const angIdx=menuLines.length;
  menuPrint('');
  const hydIdx=menuLines.length;
  menuPrint('');
  const tmpIdx=menuLines.length;
  menuPrint('');
  const etaIdx=menuLines.length;
  menuPrint('');
  menuPrint(' ESC ▸ АВАРИЙНАЯ ОСТАНОВКА','dim');
  const ref={bar:barIdx,ang:angIdx,hyd:hydIdx,tmp:tmpIdx,eta:etaIdx};
  renderInput();
  sfx.gearClunk();
  setTimeout(function(){ if(menuState==='gear') sfx.gearClunk(); },700);
  startGearNoise();

  gearStart=performance.now();
  gearLastPct=-1;
  let clunkAt=performance.now();
  const barW=30;
  function frame(now){
    if(menuState!=='gear') return;
    const p=Math.min(1,(now-gearStart)/GEAR_MS);
    const pct=Math.floor(p*100);
    if(pct!==gearLastPct){
      gearLastPct=pct;
      const f=Math.round(p*barW);
      menuLines[ref.bar].t=' ▕'+'█'.repeat(f)+'░'.repeat(barW-f)+'▏ '+String(pct).padStart(3,'0')+'%';
      const ang=Math.round(p*120);
      menuLines[ref.ang].t=' УГОЛ ПОВОРОТА ▸ '+String(ang).padStart(3,'0')+'° / 120°';
      menuLines[ref.hyd].t=' ГИДРАВЛИКА ▸ '+Math.round(168+Math.sin(now/1400)*14+p*12)+' АТМ';
      menuLines[ref.tmp].t=' ТЕМПЕРАТУРА УЗЛА ▸ '+Math.round(38+p*26)+'°C';
      menuLines[ref.eta].t=' ОСТАЛОСЬ ▸ '+Math.ceil((1-p)*34)+' СЕК';
      renderInput();
      if(now-clunkAt>2700){ clunkAt=now; sfx.gearClunk(); }
    }
    if(p>=1){
      finishGearCycle();
      return;
    }
    gearRAF=requestAnimationFrame(frame);
  }
  gearRAF=requestAnimationFrame(frame);
}
function finishGearCycle(){
  if(gearRAF){ cancelAnimationFrame(gearRAF); gearRAF=null; }
  stopGearNoise();
  gearState=gearTarget;
  try{ localStorage.setItem(GEAR_KEY,gearState); }catch(e){}
  sfx.gearDone();
  audit('СТОЙЛО ▸ ШЕСТЕРНЯ '+(gearState==='open'?'ОТКРЫТА':'ЗАКРЫТА'));
  menuLines=[];
  menuPrint(dTop(),'bright');
  menuPrint(dRow('ЦИКЛ ЗАВЕРШЁН'),'bright');
  menuPrint(dRow('ШЕСТЕРНЯ ▸ '+(gearState==='open'?'ОТКРЫТА':'ЗАКРЫТА')),'bright');
  menuPrint(dBot(),'bright');
  menuPrint('');
  menuPrint(' ГЕРМЕТИЗАЦИЯ '+(gearState==='open'?'СНЯТА':'ВОССТАНОВЛЕНА'),'dim');
  renderInput();
  menuState='stable';
  setTimeout(function(){
    if(menuState==='stable') showStable([' ШЕСТЕРНЯ ▸ '+(gearState==='open'?'ОТКРЫТА':'ЗАКРЫТА')]);
  },2400);
}

  ];

/* ---------- ESC-ОТМЕНА ---------- */
function handleEscape(){
  switch(menuState){
    case 'retina': finishRetinaScan(true); break;
    case 'pass': case 'reg_name': case 'reg_pass':
      sfx.cancel(); showOperatorMenu(); break;
    case 'admin_pass':
      sfx.cancel();
      if(curOperator()) showMainMenu();
      else showOperatorMenu();
      break;
    case 'admin': case 'prod': closePanelToStart(); break;
    case 'adm_reset_num': case 'adm_reset_yes': case 'adm_del_num':
    case 'adm_medals_op': case 'adm_medal_pick':
    case 'adm_rank_op': case 'adm_rank_set':
    case 'adm_xp_op': case 'adm_xp_set':
    case 'adm_audit': case 'adm_members':
      sfx.cancel(); backToPanel(); break;
    case 'adm_member_add': case 'adm_member_del':
      sfx.cancel(); showAdmMembers(); break;
    case 'adm_code': case 'adm_code_confirm':
      sfx.cancel(); backToPanel([' СМЕНА КОДА ОТМЕНЕНА']); break;
    case 'mk_code_new': case 'mk_code_confirm':
      sfx.cancel(); backToPanel([' СМЕНА КОДА ОТМЕНЕНА']); break;
    case 'adm_reboot':
      sfx.cancel(); showStable(); break;
    case 'adm_keys': sfx.cancel(); backToPanel(); break;
    case 'adm_key_revoke': sfx.cancel(); showAdmKeys(); break;
    case 'adm_key_revoke_yes': sfx.cancel(); showAdmKeyRevoke(); break;
    case 'adm_key_new_name': case 'adm_key_new_limit': case 'adm_key_new_val':
      sfx.cancel(); showAdmKeys([' ВЫПУСК ОТМЕНЁН']); break;
    case 'mk_pass': sfx.cancel(); gotoMainMenu(); break;
    case 'mk_init':
      cancelKeyInit(); sfx.cancel();
      gotoMainMenu();
      break;
    case 'j_new_title': case 'j_new_body':
      sfx.cancel(); showJournal([' ЧЕРНОВИК ОТМЕНЁН']); break;
    case 'j_pub': sfx.cancel(); showJournal(); break;
    case 'j_pub_yes': sfx.cancel(); publishJournalPrompt(jTarget); break;
    case 'j_read':
      sfx.cancel();
      if(jBack==='j_pub'&&jTarget) publishJournalPrompt(jTarget);
      else showJournal();
      break;
    case 'stock_add_name': case 'stock_add_qty':
    case 'stock_take_name': case 'stock_take_qty':
      sfx.cancel(); showStock(); break;
    case 'sci_kind': case 'sci_topic': case 'sci_rank': case 'sci_body':
      sfx.cancel(); showScience([' СОЗДАНИЕ ОТМЕНЕНО']); break;
    case 'sci_view': sfx.cancel(); showScience(); break;
    case 'med_new_name': case 'med_new_rank': case 'med_new_text':
      sfx.cancel(); showMed([' СОЗДАНИЕ ОТМЕНЕНО']); break;
    case 'med_view': sfx.cancel(); showMed(); break;
    case 'med_add': sfx.cancel(); if(medCard) showMedCard(medCard); else showMed(); break;
    case 'about': case 'members': case 'profile':
      sfx.cancel(); gotoMainMenu(); break;
    case 'prof_pass':
      sfx.cancel(); showProfile(); break;
    case 'logout_confirm': sfx.cancel(); showMainMenu(); break;
    case 'stable': sfx.cancel(); backToPanel(); break;
    case 'main': askLogout(); break;
    default: break;
  }
}

let opsCache=[];
function getCachedOp(name){
  return opsCache.find(o=>o.name===name)||null;
}
async function refreshOpsCache(){
  try{
    const q=await fxWrap(fs.collection('ops').limit(50).get());
    opsCache=q.docs.map(d=>Object.assign({id:d.id},d.data()));
  }catch(e){}
}

function audit(what){
  if(!dbOK()||!fs) return;
  const who=(curOperator()||'?')+(adminMode?' ◈':'')+(mkGranted?' ✦':'');
  fs.collection('audit').add({at:Date.now(),d:nowStamp(),who:who,what:what})
    .catch(function(){});
}

async function submitMenu(){
  const buf=inputBuf;
  inputBuf='';

  if(menuState==='menu'){
    if(buf==='0'){
      menuState='reg_name'; menuPrint('');
      menuPrint(sep('РЕГИСТРАЦИЯ'),'bright');
      menuPrint(' ИМЯ: МИНИМУМ '+NAME_MIN+' СИМВОЛОВ','dim');
      menuPrint(' ПАРОЛЬ: БЕЗ ОГРАНИЧЕНИЙ','dim');
      renderInput();
      return;
    }
    const n=parseInt(buf,10);
    if(!registryNames.length&&!registryErr){
      menuPrint(' ЗАПРОС РЕЕСТРА...','dim'); renderInput();
      await refreshRegistry();
      menuLines=menuLines.filter(l=>l.t.indexOf('ЗАПРОС РЕЕСТРА')<0);
      renderInput();
    }
    if(!buf||isNaN(n)||n<1||n>Math.min(SLOTS,registryNames.length)){
      menuErr(registryNames.length
        ?'▲ ОШИБКА: НЕВЕРНЫЙ НОМЕР ОПЕРАТОРА'
        :'▲ РЕЕСТР НЕДОСТУПЕН · ПРОВЕРЬ СВЯЗЬ И ОБНОВИ СТРАНИЦУ');
      renderInput();
      return;
    }
    selectedOp=registryNames[n-1];
    menuState='pass';
    menuPrint(''); menuPrint(' ОПЕРАТОР ▸ '+selectedOp);
    menuPrint(' ВВЕДИТЕ ПАРОЛЬ + ENTER','dim');
    renderInput();
    return;
  }

    if(menuState==='pass'){
    if(!dbOK()){ menuErr('▲ БАЗА НЕДОСТУПНА'); renderInput(); return; }
    menuPrint(' ПРОВЕРКА В БАЗЕ...','dim'); renderInput();
    try{
      const name=selectedOp;
      const cred=await fxWrap(auth.signInWithEmailAndPassword(fbEmail(name),fbPass(name,buf)));
      myUid=cred.user.uid;
      menuPrint(' АВТОРИЗАЦИЯ ОК · ЧТЕНИЕ ПРОФИЛЯ...','dim'); renderInput();
      let docSnap=null;
      try{
        const d=await fxWrap(fs.collection('ops').doc(myUid).get());
        if(d.exists) docSnap=d.data();
      }catch(readErr){
        /* БОЛЬШЕ НЕ МОЛЧИМ: показываем настоящую причину */
        menuErr('▲ ЧТЕНИЕ ПРОФИЛЯ: '+authErrText(readErr));
        renderInput();
        return;
      }
      if(!docSnap){
        menuPrint(' ПРОФИЛЬ НЕ НАЙДЕН · СОЗДАНИЕ...','dim'); renderInput();
        try{
          docSnap={name:name,nameLower:name.toLowerCase(),rank:1,xp:0,manualRank:null,
                   medals:[],stats:freshStats(),createdAt:Date.now()};
          await fxWrap(fs.collection('ops').doc(myUid).set(docSnap));
          audit('ПОВТОРНАЯ АКТИВАЦИЯ ▸ '+name);
        }catch(createErr){
          menuErr('▲ СОЗДАНИЕ ПРОФИЛЯ: '+authErrText(createErr));
          renderInput();
          return;
        }
      }
      myDoc=docSnap;
      try{ localStorage.setItem(CUR_KEY,name); }catch(e){}
      audit('ПАРОЛЬ ПРИНЯТ ▸ '+name);
      fbSeedConfig();
      startRetinaScan();
    }catch(e){
      menuErr(authErrText(e)); renderInput();
    }
    return;
  }

  if(menuState==='reg_name'){
    const name=buf.trim();
    if(name.length<NAME_MIN){ menuErr('▲ ИМЯ КОРОЧЕ '+NAME_MIN+' СИМВОЛОВ'); renderInput(); return; }
    regName=name; menuState='reg_pass';
    menuPrint(' ИМЯ ПРИНЯТО ▸ '+name);
    renderInput();
    return;
  }

  if(menuState==='reg_pass'){
    if(!dbOK()){ menuErr('▲ БАЗА НЕДОСТУПНА'); renderInput(); return; }
    menuPrint(' СОЗДАНИЕ АККАУНТА...','dim'); renderInput();
    try{
      const name=regName;
      const cred=await fxWrap(auth.createUserWithEmailAndPassword(fbEmail(name),fbPass(name,buf)));
      myUid=cred.user.uid;
      myDoc={name:name,nameLower:name.toLowerCase(),rank:1,xp:XP.REG,manualRank:null,
             medals:[],stats:freshStats(),createdAt:Date.now()};
      await fxWrap(fs.collection('ops').doc(myUid).set(myDoc));
      selectedOp=name;
      try{ localStorage.setItem(CUR_KEY,name); }catch(e){}
      audit('РЕГИСТРАЦИЯ ▸ '+name+' · +'+XP.REG+' XP');
      fbSeedConfig();
      startRetinaScan();
    }catch(e){
      menuErr(authErrText(e)); renderInput();
    }
    return;
  }

  if(menuState==='main'){
    const n=parseInt(buf,10);
    if(!buf||isNaN(n)||n<1||n>MAIN_ITEMS.length){
      menuErr('▲ НЕТ РАЗДЕЛА С ТАКИМ НОМЕРОМ'); renderInput(); return;
    }
    sfx.beep();
    if(n===1) showAbout();
    else if(n===2) await showMembers();
    else if(n===3) showJournal();
    else if(n===4) showStock();
    else if(n===5) showScience();
    else if(n===6) showMed();
    else if(n===7) await showProfile();
    return;
  }

  if(menuState==='logout_confirm'){
    if(buf==='1'){ doLogout(); return; }
    if(buf==='2'){ showMainMenu(); return; }
    renderInput(); return;
  }

  if(menuState==='admin_pass'){
    if(!dbOK()){ menuErr('▲ БАЗА НЕДОСТУПНА'); renderInput(); return; }
    const h=oidlHash(normCode(buf));
    menuPrint(' ПРОВЕРКА КОДА...','dim'); renderInput();
    try{
      const cfg=await fxWrap(fs.collection('config').doc('adminCode').get());
      if(!cfg.exists||cfg.data().hash!==h){
        menuErr('▲ КОД ОТКЛОНЁН'); renderInput(); return;
      }
      await fxWrap(fs.collection('claims').doc(myUid).set({hash:h,at:Date.now()}));
      await fxWrap(fs.collection('ops').doc(myUid).update({rank:6}));
      if(myDoc) myDoc.rank=6;
      adminMode=true;
      sbTags.classList.remove('hidden');
      sbAdmin.classList.remove('hidden');
      sfx.grant();
      audit('ВХОД В АДМИН-ПАНЕЛЬ (СМОТРИТЕЛЬ)');
      showAdminPanel();
    }catch(e){
      menuErr('▲ КОД ОТКЛОНЁН СИСТЕМОЙ'); renderInput();
    }
    return;
  }

  if(menuState==='admin'){
    if(buf==='0'){ closePanelToStart(); return; }
    if(buf==='1'){
      menuPrint(' ЗАПРОС РЕЕСТРА...','dim'); renderInput();
      await refreshOpsCache();
      const extra=[{t:'──[ РЕЕСТР ОПЕРАТОРОВ ]──'}];
      if(!opsCache.length) extra.push({t:'  РЕЕСТР ПУСТ',c:'dim'});
      opsCache.forEach((o,i)=>{
        ensureOpFields(o);
        extra.push({t:'  ['+(i+1)+'] ▸ '+o.name+' · Д'+(o.manualRank||xpRank(o.xp))+' · '+o.xp+' XP'});
      });
      backToPanel(extra); return;
    }
    if(buf==='2'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_reset_num';
      menuPrint(''); menuPrint(' ОБНУЛЕНИЕ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='3'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_del_num';
      menuPrint(''); menuPrint(' УДАЛЕНИЕ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='4'){
      if(hatchState==='busy'){ backToPanel([{t:'▲ ПРИВОД НИШИ ЗАНЯТ'}]); }
      else{
        const willOpen=(hatchState==='closed');
        toggleHatch();
        backToPanel([{t:' НИША ▸ '+(willOpen?'ОТКРЫВАЕТСЯ':'ЗАКРЫВАЕТСЯ')}]);
      }
      return;
    }
    if(buf==='5'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_medals_op';
      menuPrint(''); menuPrint(' МЕДАЛИ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='6'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_rank_op';
      menuPrint(''); menuPrint(' ДОПУСК: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='7'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_xp_op';
      menuPrint(''); menuPrint(' XP: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='8'){ showAdmKeys(); return; }
    if(buf==='9'){ showAdmAudit(); return; }
    if(buf==='10'){ showStable(); return; }
    menuErr('▲ НЕТ ТАКОЙ КОМАНДЫ'); renderInput(); return;
  }

  if(menuState==='prod'){
    if(buf==='0'){ closePanelToStart(); return; }
    if(buf==='1'){
      menuPrint(' ЗАПРОС ДАННЫХ...','dim'); renderInput();
      await refreshOpsCache();
      const extra=[{t:'──[ ОПЕРАТОРЫ · ПОЛНЫЕ ДАННЫЕ ]──'}];
      if(!opsCache.length) extra.push({t:'  РЕЕСТР ПУСТ',c:'dim'});
      opsCache.forEach((o,i)=>{
        ensureOpFields(o);
        const r=o.manualRank||xpRank(o.xp);
        extra.push({t:'  ['+(i+1)+'] ▸ '+o.name+' · ['+r+'] '+RANK_NAMES[r]+(o.manualRank?' (НАЗН)':'')});
        extra.push({t:'      XP:'+o.xp+' · СЕРИЯ:'+o.stats.streak+'Д · ВХОД:'+o.stats.logins,c:'dim'});
        extra.push({t:'      ЗАП:'+o.stats.journal+' ПУБ:'+o.stats.pub+' НАУК:'+o.stats.sciTotal+' КАРТ:'+o.stats.med+' СКЛ:'+o.stats.stock,c:'dim'});
        extra.push({t:'      МЕДАЛЕЙ:'+o.medals.length,c:'dim'});
      });
      backToPanel(extra); return;
    }
    if(buf==='2'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_reset_num';
      menuPrint(''); menuPrint(' ОБНУЛЕНИЕ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='3'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_del_num';
      menuPrint(''); menuPrint(' УДАЛЕНИЕ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='4'){
      if(hatchState==='busy'){ backToPanel([{t:'▲ ПРИВОД НИШИ ЗАНЯТ'}]); }
      else{
        const willOpen=(hatchState==='closed');
        toggleHatch();
        backToPanel([{t:' НИША ▸ '+(willOpen?'ОТКРЫВАЕТСЯ':'ЗАКРЫВАЕТСЯ')}]);
      }
      return;
    }
    if(buf==='5'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_medals_op';
      menuPrint(''); menuPrint(' МЕДАЛИ: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='6'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_rank_op';
      menuPrint(''); menuPrint(' ДОПУСК: НОМЕР ОПЕРАТОРА','dim');

    if(buf==='7'){
      if(!opsCache.length){ await refreshOpsCache(); }
      if(!opsCache.length){ sfx.error(); backToPanel([{t:'▲ РЕЕСТР ПУСТ'}]); return; }
      menuState='adm_xp_op';
      menuPrint(''); menuPrint(' XP: НОМЕР ОПЕРАТОРА','dim');
      renderInput(); return;
    }
    if(buf==='8'){ showAdmKeys(); return; }
    if(buf==='9'){ showAdmAudit(); return; }
    if(buf==='10'){ showAdmMembers(); return; }
    if(buf==='11'){ showAdmCodeSet(); return; }
    if(buf==='12'){ showStable(); return; }
    if(buf==='13'){ startStableAnalysis(true); return; }
    if(buf==='14'){ showMkCodeSet(); return; }
    menuErr('▲ НЕТ ТАКОЙ КОМАНДЫ'); renderInput(); return;
  }

  if(menuState==='adm_reset_num'){
    const n=parseInt(buf,10);
    if(!buf||isNaN(n)||n<1||n>opsCache.length){ menuErr('▲ НЕТ ОПЕРАТОРА С ТАКИМ НОМЕРОМ'); renderInput(); return; }
    adminTargetUid=opsCache[n-1].id;
    admTargetName=opsCache[n-1].name;

function handleMenuKey(e){
  const isEnter=(e.key==='Enter'||e.keyCode===13);
  if(menuState==='granting') return;
  if(fxBusy) return;
  if(menuState==='gear'){
    if(e.key==='Escape'){ e.preventDefault(); abortGearCycle(); }
    return;
  }
  if(menuState==='analys'){
    if(e.key==='Escape'){ e.preventDefault(); abortAnalysis(); }
    return;
  }
  if(e.key==='Escape'){
    e.preventDefault();
    handleEscape();
    return;
  }
  if(menuState==='retina'){
    if(isEnter){ e.preventDefault(); finishRetinaScan(true); }
    return;
  }
  if(menuState==='mk_init') return;
  if(isEnter){
    e.preventDefault();
    sfx.button();
    submitMenu();
    return;
  }
  if(e.key==='Backspace'){
    e.preventDefault();
    if(inputBuf.length){ inputBuf=inputBuf.slice(0,-1); sfx.key(); renderInput(); }
    return;
  }
  if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey) return;
  e.preventDefault();
  if(inputBuf.length>=inputMax()) return;
  inputBuf+=e.key;
  sfx.key();
  renderInput();
}

let kbdLang='RU';
try{ kbdLang=localStorage.getItem(KBD_LANG_KEY)||'RU'; }catch(e){}
let kbdHidden=false;
let kbdSig='';

const KB_ROWS={
  RU:['ЙЦУКЕНГШЩЗХЪ','ФЫВАПРОЛДЖЭ','ЯЧСМИТЬБЮЁ'],
  EN:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']
};
const KB_NUM='1234567890.-:';

function kbKey(label,code,extra){
  const b=document.createElement('button');
  b.type='button';
  b.className='kb-key'+(extra?' '+extra:'');
  b.textContent=label;
  b.addEventListener('click',function(ev){
    ev.preventDefault();
    kbdAction(code);
  });
  return b;
}
function kbdAction(code){
  ensureAudio();
  if(code==='ESC'){
    if(fxBusy) return;
    if(menuState==='gear'){ abortGearCycle(); return; }
    if(menuState==='analys'){ abortAnalysis(); return; }
    sfx.cancel();
    handleEscape();
    return;
  }
  if(code==='ENT'){
    if(fxBusy||menuState==='granting'||menuState==='retina'||menuState==='mk_init') return;
    sfx.button();
    submitMenu();
    return;
  }
  if(code==='BS'){
    if(inputBuf.length){ inputBuf=inputBuf.slice(0,-1); sfx.key(); renderInput(); }
    return;
  }
  if(code==='LANG'){
    kbdLang=(kbdLang==='RU')?'EN':'RU';
    try{ localStorage.setItem(KBD_LANG_KEY,kbdLang); }catch(e){}
    buildKbd(); return;
  }
  if(code==='::'){
    inputBuf+='::';
    kbdAction('ENT');
    return;
  }
  if(inputBuf.length>=inputMax()) return;
  inputBuf+=code;
  sfx.key();
  renderInput();
}
function buildKbd(){
  const kbd=document.getElementById('kbd');
  if(!kbd) return;
  kbd.innerHTML='';
  const rnum=document.createElement('div');
  rnum.className='kb-row kb-num';
  for(const ch of KB_NUM) rnum.appendChild(kbKey(ch,ch));
  kbd.appendChild(rnum);
  for(const row of KB_ROWS[kbdLang]){
    const r=document.createElement('div');
    r.className='kb-row';
    for(const ch of row) r.appendChild(kbKey(ch,ch));
    kbd.appendChild(r);
  }
  const s=document.createElement('div');
  s.className='kb-row';
  s.appendChild(kbKey(kbdLang==='RU'?'РУ':'EN','LANG','kb-lang'));
  s.appendChild(kbKey('ПРОБЕЛ',' ','kb-space'));
  if(isMultiState()) s.appendChild(kbKey('::','::','kb-fn'));
  s.appendChild(kbKey('⌫','BS'));
  s.appendChild(kbKey('ESC','ESC'));
  s.appendChild(kbKey('↵','ENT','kb-enter'));
  kbd.appendChild(s);
}
function updateTouchUI(){

function savePowerState(){ try{ localStorage.setItem(PWR_KEY,powered?'on':'off'); }catch(e){} }

async function powerOn(){
  if(powered) return;
  powered=true;
  savePowerState();
  ensureAudio();

  flashEl.classList.remove('hidden');
  flashEl.classList.add('flash-anim');
  setTimeout(()=>{ flashEl.classList.remove('flash-anim'); flashEl.classList.add('hidden'); },320);

  screenEl.classList.add('on');
  screenInner.classList.remove('hidden','crt-off');
  screenInner.classList.add('crt-on');
  statusBar.classList.remove('hidden');
  updateStatusBar();

  sfx.powerOn();
  startHum();

  booting=true; skipBoot=false;
  skipHint.classList.remove('hidden');
  updateLamps();

  await sleep(2400);
  await bootSequence();
  booting=false;
  skipHint.classList.add('hidden');
  updateLamps();
  startLampIdle();

  await sleep(400);
  screenContent.innerHTML='';
  showOperatorMenu();
}

function powerOff(){
  if(!powered) return;
  powered=false; booting=false; skipBoot=false;
  savePowerState();
  skipHint.classList.add('hidden');

  adminMode=false;
  if(mkGranted){ mkGranted=false; mkVia=null; }
  sbTags.classList.add('hidden');
  sbAdmin.classList.add('hidden');
  sbMaker.classList.add('hidden');
  cancelKeyInit();
  cancelRetinaScan();
  if(gearRAF){ cancelAnimationFrame(gearRAF); gearRAF=null; }
  stopGearNoise();
  stopAnalysis();

  stopLampIdle();
  updateLamps();
  updateTouchUI();

  sfx.powerOff();
  stopHum(0.5);

  screenInner.classList.remove('crt-on');
  screenInner.classList.add('crt-off');
  statusBar.classList.add('hidden');
  screenEl.classList.remove('on');

  setTimeout(()=>{
    if(!powered){
      screenInner.classList.add('hidden');
      screenInner.classList.remove('crt-off');
      screenContent.innerHTML='';
    }
  },700);
}

const LEVER_ON=0, LEVER_OFF=1;
let leverPos=LEVER_OFF, knobTop=110, drag=null;
function knobMaxTop(){ return leverSlot.clientHeight-leverKnob.offsetHeight; }
function setKnobTop(top,animate){
  knobTop=Math.max(0,Math.min(knobMaxTop(),top));
  leverKnob.classList.toggle('settle',!!animate);
  leverKnob.style.top=knobTop+'px';
}
leverKnob.addEventListener('pointerdown',(e)=>{
  e.preventDefault(); e.stopPropagation(); ensureAudio();
  drag={startY:e.clientY,startPos:knobTop};
  leverKnob.setPointerCapture(e.pointerId);
});
leverKnob.addEventListener('pointermove',(e)=>{
  if(!drag) return;
  setKnobTop(drag.startPos+(e.clientY-drag.startY),false);
});
function endDrag(){
  if(!drag) return;
  drag=null;
  const newPos=(knobTop<knobMaxTop()/2)?LEVER_ON:LEVER_OFF;
  setKnobTop(newPos===LEVER_ON?0:knobMaxTop(),true);
  if(newPos!==leverPos){
    leverPos=newPos;
    sfx.lever();
    if(leverPos===LEVER_ON) powerOn(); else powerOff();
  } else {
    sfx.toggle();
  }
}
leverKnob.addEventListener('pointerup',endDrag);
leverKnob.addEventListener('pointercancel',endDrag);

let camClicks=0, camTimer=null, hatchState='closed';
camLens.addEventListener('pointerdown',(e)=>e.stopPropagation());
camLens.addEventListener('click',()=>{
  sfx.camera();
  camClicks++;
  clearTimeout(camTimer);
  if(camClicks>=4){ camClicks=0; toggleHatch(); }
  else{ camTimer=setTimeout(()=>{camClicks=0;},1600); }
});
function toggleHatch(){
  if(hatchState==='busy') return;
  if(hatchState==='closed') openHatch(); else closeHatch();
}
function openHatch(){
  hatchState='busy';
  sfx.hatchOpen();
  hatch.classList.remove('anim-close','is-open');
  hatch.classList.add('anim-open');
}
function closeHatch(){
  hatchState='busy';
  sfx.hatchClose();
  hatch.classList.remove('is-open');
  hatch.classList.add('anim-close');
}
hatch.addEventListener('animationend',(e)=>{
  if(e.target!==hatch) return;
  if(hatch.classList.contains('anim-open')){
    hatch.classList.add('is-open'); hatch.classList.remove('anim-open'); hatchState='open';
  } else if(hatch.classList.contains('anim-close')){
    hatch.classList.remove('anim-close'); hatchState='closed';
  }
});

/* ==================================================================
   МАСТЕР-КЛЮЧ: физика
================================================================== */
let keyState='stowed';
let keyPos={x:0,y:0};
let keyVel={x:0,y:0};
let keyTilt=0;
let keyDrag=null;
let keyFlingRAF=null;
let lastBounceTs=0;

function applyKeyTransform(scale){
  const s=(scale===undefined)?(keyDrag?1.06:1):scale;
  masterKey.style.transform='translate3d('+keyPos.x+'px,'+keyPos.y+'px,0) rotate('+keyTilt.toFixed(2)+'deg) scale('+s+')';
}
function keySize(){ return {w:masterKey.offsetWidth,h:masterKey.offsetHeight}; }
function clampKeyToBounds(){
  const w=keySize();
  keyPos.x=Math.max(0,Math.min(window.innerWidth-w.w,keyPos.x));
  keyPos.y=Math.max(0,Math.min(window.innerHeight-w.h,keyPos.y));
}
function stopFling(){ if(keyFlingRAF){cancelAnimationFrame(keyFlingRAF); keyFlingRAF=null;} }

masterKey.addEventListener('pointerdown',(e)=>{
  e.preventDefault(); e.stopPropagation();
  if(keyDrag) return;
  ensureAudio();
  stopFling();

  const wasInserted=(keyState==='inserted');

  if(keyState==='stowed'||keyState==='inserted'){
    const r=masterKey.getBoundingClientRect();
    keyPos.x=r.left; keyPos.y=r.top;
    masterKey.style.width=masterKey.offsetWidth+'px';
    masterKey.style.height=masterKey.offsetHeight+'px';
    masterKey.classList.remove('stowed','inserted','snap-in');
    document.body.appendChild(masterKey);
    masterKey.classList.add('free');
    keyTilt=0;
    applyKeyTransform(1);
    keyState='free';

    if(wasInserted){
      if(mkGranted){ revokeMaker('КЛЮЧ ИЗВЛЕЧЁН'); }
      else if(menuState==='mk_init'||menuState==='mk_pass'){
        cancelKeyInit();
        sfx.error();
        gotoMainMenu();
      }
    }
  }

  sfx.keycard();
  keyDrag={offX:e.clientX-keyPos.x,offY:e.clientY-keyPos.y,samples:[{x:e.clientX,y:e.clientY,t:performance.now()}]};
  masterKey.classList.add('dragging');
  masterKey.setPointerCapture(e.pointerId);
});
masterKey.addEventListener('pointermove',(e)=>{
  if(!keyDrag) return;
  keyPos.x=e.clientX-keyDrag.offX;
  keyPos.y=e.clientY-keyDrag.offY;
  const s=keyDrag.samples;
  const prev=s[s.length-1];
  const vx=(e.clientX-prev.x)/Math.max(1,performance.now()-prev.t);
  keyTilt=Math.max(-10,Math.min(10,keyTilt*0.8+vx*6));
  applyKeyTransform();
  const now=performance.now();
  s.push({x:e.clientX,y:e.clientY,t:now});
  while(s.length>2&&now-s[0].t>120) s.shift();
  if(hatchState==='open'){
    const hole=slotHole.getBoundingClientRect();
    const k=keySize();
    const cx=keyPos.x+k.w/2, cy=keyPos.y+k.h/2;
    const hx=hole.left+hole.width/2, hy=hole.top+hole.height/2;
    const near=Math.hypot(cx-hx,cy-hy)<70;
    slotHole.classList.toggle('hot',near);
  } else { slotHole.classList.remove('hot'); }
});
function endKeyDrag(e){
  if(!keyDrag) return;
  const d=keyDrag; keyDrag=null;
  masterKey.classList.remove('dragging');
  slotHole.classList.remove('hot');
  const s=d.samples;
  const first=s[0], last=s[s.length-1];
  const dt=Math.max(1,last.t-first.t);
  let vx=(last.x-first.x)/dt, vy=(last.y-first.y)/dt;
  const cap=3.2, sp=Math.hypot(vx,vy);
  if(sp>cap){ vx=vx/sp*cap; vy=vy/sp*cap; }
  keyVel.x=vx; keyVel.y=vy;
  if(hatchState==='open'){
    const hole=slotHole.getBoundingClientRect();
    const k=keySize();
    const cx=keyPos.x+k.w/2, cy=keyPos.y+k.h/2;
    const hx=hole.left+hole.width/2, hy=hole.top+hole.height/2;
    if(Math.hypot(cx-hx,cy-hy)<70){ insertKey(hole,k); return; }
  }
  if(Math.hypot(vx,vy)>0.35) sfx.whoosh(Math.hypot(vx,vy));
  startFling();
}
masterKey.addEventListener('pointerup',endKeyDrag);
masterKey.addEventListener('pointercancel',endKeyDrag);

function startFling(){
  stopFling();
  let prevTs=performance.now();
  function frame(ts){
    const dt=Math.min(48,ts-prevTs); prevTs=ts;
    keyVel.y+=GRAV*dt;
    if(keyVel.y>3) keyVel.y=3;
    keyPos.x+=keyVel.x*dt;
    keyPos.y+=keyVel.y*dt;
    keyVel.x*=Math.exp(-dt*0.0004);
    const w=keySize();
    const maxX=window.innerWidth-w.w, maxY=window.innerHeight-w.h;
    let hit=0, onFloor=false;
    if(keyPos.x<0){ keyPos.x=0; keyVel.x=-keyVel.x*0.55; hit=Math.abs(keyVel.x); }
    else if(keyPos.x>maxX){ keyPos.x=maxX; keyVel.x=-keyVel.x*0.55; hit=Math.abs(keyVel.x); }
    if(keyPos.y<0){ keyPos.y=0; keyVel.y=-keyVel.y*0.5; hit=Math.max(hit,Math.abs(keyVel.y)); }
    else if(keyPos.y>maxY){
      keyPos.y=maxY;
      if(keyVel.y>0.05) hit=Math.max(hit,keyVel.y*0.5);
      keyVel.y=-keyVel.y*0.45;
      if(Math.abs(keyVel.y)<0.06) keyVel.y=0;
      onFloor=true;
    }
    if(onFloor) keyVel.x*=Math.exp(-dt*0.006);
    if(hit>0.25&&ts-lastBounceTs>70){ lastBounceTs=ts; sfx.bounce(hit); }
    keyTilt=Math.max(-12,Math.min(12,keyVel.x*4));
    applyKeyTransform();
    if(onFloor&&keyVel.y===0&&Math.abs(keyVel.x)<0.02){
      keyVel.x=0; keyVel.y=0; keyTilt=0;
      applyKeyTransform(1);
      keyFlingRAF=null;
      return;
    }
    keyFlingRAF=requestAnimationFrame(frame);
  }
  keyFlingRAF=requestAnimationFrame(frame);
}

function insertKey(holeRect,k){
  stopFling();
  keyState='inserting';
  keyTilt=0;
  slotHole.classList.remove('hot');
  masterKey.classList.add('settling');
  keyPos.x=holeRect.left+(holeRect.width-k.w)/2;
  keyPos.y=holeRect.bottom-k.h+2;
  applyKeyTransform(1);
  sfx.insert();
  const finish=()=>{
    masterKey.classList.remove('free','settling','dragging');
    masterKey.classList.add('inserted');
    masterKey.classList.add('snap-in');
    masterKey.style.width='';
    masterKey.style.height='';
    masterKey.style.transform='';
    slotHole.appendChild(masterKey);
    keyState='inserted';
    if(powered&&!booting&&curOperator()&&!mkGranted&&!screenBusy()&&!fxBusy){
      setTimeout(startKeyInit,500);
    }
  };
  let done=false;
  const once=()=>{ if(!done){done=true; finish();} };
  masterKey.addEventListener('transitionend',once,{once:true});
  setTimeout(once,300);
}

window.addEventListener('resize',()=>{
  cplCache=0;
  if(keyState==='free'&&!keyDrag){
    clampKeyToBounds();
    applyKeyTransform(1);
  }
});
